name: Deploy to Modal

on:
  # メインブランチへのpush時に自動デプロイ
  push:
    branches:
      - main
      - master
    paths:
      - 'neuroq-runpod/modal_app.py'
      - '.github/workflows/modal-deploy.yml'

  # 手動トリガー
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy NeuroQ API to Modal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # Git LFS ファイルも取得

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal CLI
        run: |
          pip install modal

      - name: Authenticate with Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Deploy to Modal
        working-directory: neuroq-runpod
        run: |
          modal deploy modal_app.py

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "NeuroQ API has been deployed to Modal." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **Custom Domain**: https://api.neuroq.he-ro.jp" >> $GITHUB_STEP_SUMMARY
          echo "- **Modal Dashboard**: https://modal.com/apps/neuroq-api" >> $GITHUB_STEP_SUMMARY
